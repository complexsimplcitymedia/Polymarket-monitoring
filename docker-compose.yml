services:
  db:
    image: pgvector/pgvector:pg17
    container_name: polymarket-db
    restart: unless-stopped
    env_file:
      - path: ./secrets/.env
        required: false
      - path: ./.env
        required: false
    environment:
      POSTGRES_DB: poly_db
      POSTGRES_USER: wolf
      POSTGRES_[PASSWORD]: wolfpoly2026
    ports:
      - "127.0.0.1:5433:5432"
      - "100.110.82.54:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wolf -d poly_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: .
      dockerfile: Dockerfile.backend
    image: polymarket-backend:latest
    container_name: polymarket-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      polymarket-ticks:
        condition: service_started
    env_file:
      - path: ./secrets/.env
        required: false
      - path: ./.env
        required: false
    environment:
      TRADE_SOCKS_PROXY: ${TRADE_SOCKS_PROXY:-socks5h://polymarket-ticks:1080}
    ports:
      - "127.0.0.1:8001:8000"
      - "100.110.82.54:8001:8000"
    volumes:
      - ./src/backend:/app/src/backend
    networks:
      - pnet

  ingest:
    build:
      context: .
      dockerfile: Dockerfile.ingest
    image: polymarket-ingest:latest
    container_name: polymarket-ingest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    env_file:
      - path: ./secrets/.env
        required: false
      - path: ./.env
        required: false
    ports:
      - "127.0.0.1:8002:8000"
      - "100.110.82.54:8002:8000"
    networks:
      - pnet

  # Tailscale sidecar: the ticks worker shares this container's network, so only its traffic exits through London.
  polymarket-ticks:
    image: tailscale/tailscale:latest
    container_name: polymarket-ticks
    hostname: polymarket-ticks
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKS5_SERVER: ":1080"
      TS_EXTRA_ARGS: --exit-node=100.110.82.10 --exit-node-allow-lan-access
      TS_ACCEPT_DNS: "false"
      TS_USERSPACE: "false"
    volumes:
      - ts_london_state:/var/lib/tailscale
    networks:
      - pnet

  ticks:
    build:
      context: .
      dockerfile: Dockerfile.ingest
    image: polymarket-ingest:latest
    container_name: polymarket-ticks-app
    command: ["node", "ticks.js"]
    restart: unless-stopped
    networks:
      - pnet
    depends_on:
      - polymarket-ticks
      - backend
    env_file:
      - path: ./secrets/.env
        required: false
      - path: ./.env
        required: false

  probe:
    image: polymarket-backend:latest
    container_name: polymarket-probe
    command: ["/app/.venv/bin/python", "-m", "src.backend.probe"]
    working_dir: /app
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    env_file:
      - path: ./secrets/.env
        required: false
      - path: ./.env
        required: false
    networks:
      - pnet

  frontend:
    build: 
      context: .
      dockerfile: Dockerfile.frontend
    image: polymarket-frontend:latest
    container_name: polymarket-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:80"
      - "100.110.82.54:5173:80"
    networks:
      - pnet

  executor:
    build:
      context: .
      dockerfile: Dockerfile.executor
    image: polymarket-executor:latest
    container_name: polymarket-executor
    restart: unless-stopped
    depends_on:
      - polymarket-ticks
      - backend
    env_file:
      - path: ./secrets/.env
        required: false
      - path: ./.env
        required: false
    environment:
      PORT: 9000
      HOST: ${EXECUTOR_HOST:-0.0.0.0}
      POLYMARKET_US_API_URL: ${POLYMARKET_US_API_URL:-https://api.polymarket.us}
      TRADE_SOCKS_PROXY: ${TRADE_SOCKS_PROXY:-socks5h://polymarket-ticks:1080}
    ports:
      - "9000:9000"
    networks:
      - pnet

volumes:
  postgres_data:
  ts_london_state:

networks:
  pnet:
    driver: bridge