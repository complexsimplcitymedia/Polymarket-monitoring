# Map to handle WebSocket upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# The tablet's noVNC server sends no Content-Type; with nosniff at the edge, browsers render text/plain.
map $uri $vnc_content_type {
    default          application/octet-stream;
    ~\.html?$        "text/html; charset=utf-8";
    ~/$              "text/html; charset=utf-8";
    ~\.m?js$         "text/javascript; charset=utf-8";
    ~\.css$          "text/css; charset=utf-8";
    ~\.svg$          image/svg+xml;
    ~\.png$          image/png;
    ~\.ico$          image/x-icon;
    ~\.json$         application/json;
    ~\.(oga|ogg)$    audio/ogg;
    ~\.mp3$          audio/mpeg;
    ~\.woff2?$       font/woff2;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Secure noVNC page/assets. TLS is terminated by the production edge (Caddy),
    # while this internal hop reaches the original device feed unchanged.
    location /vnc/ {
        proxy_pass http://100.110.82.108:5800/;
        proxy_hide_header Content-Type;
        add_header Content-Type $vnc_content_type always;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # noVNC's WebSocket tunnel. The tablet's :5900 is raw VNC (no WebSocket), so this goes to the
    # websockify bridge on the tailnet (scripts/sockify-tablet.service: :6900 -> tablet :5900).
    location = /vnc/websockify {
        proxy_pass http://100.110.82.54:6900;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
